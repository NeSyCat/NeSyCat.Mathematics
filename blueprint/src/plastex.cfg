[general]
renderer=HTML5
copy-theme-extras=yes
plugins=plastexdepgraph  plastexshowmore  leanblueprint

[document]
toc-depth=3
toc-non-files=True

[files]
directory=../web/
split-level= 0

[html5]
localtoc-level=0
extra-css=extra_styles.css
mathjax-dollars=False

# Dependency-graph node kinds (M5 Part B.3): plastexdepgraph's `thms` option
# (default definition+lemma+proposition+theorem+corollary) is NOT read from
# this ini file --- traced directly through plasTeX's package-loading code
# (plasTeX/Context.py's loadPythonPackage/ProcessOptions call chain) and
# confirmed empirically: `thms` is read only from the options dict attached
# to `\usepackage[...]{blueprint}` itself (leanblueprint's blueprint.py
# forwards that same dict straight into plastexdepgraph's own
# ProcessOptions), never from a plastex.cfg ini section, since neither
# package registers one. The actual fix lives in web.tex's
# `\usepackage[showmore, dep_graph, thms=...+conjecture+abbreviation]
# {blueprint}` line, extending the default list so `conjecture` and
# `abbreviation` become dependency-graph node kinds alongside
# definition/lemma/proposition/theorem/corollary.