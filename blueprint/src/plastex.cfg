# packages-dirs (C2-E9): enables loading blueprint/src/nesycatshapes.py
# (the local dependency-graph shape-fix package, \usepackage{nesycatshapes}
# in web.tex) as a genuinely LOCAL plastex package. Traced and verified
# empirically against plasTeX/Context.py's loadPythonPackage: it searches
# config['general']['packages-dirs'] (relative to the cwd plastex is run
# from, i.e. blueprint/src) FIRST, before installed plugins/builtins --
# but that option's default is an empty list, so a bare .py dropped into
# blueprint/src is NOT found without this line (confirmed: without it,
# `\usepackage{nesycatshapes}` silently no-ops with "WARNING: No Python
# version of nesycatshapes.sty was found"). This is the "local .py path"
# itself, distinct from (and simpler than) the plugins= line fallback of
# packaging nesycatshapes as an installable plugin with its own
# Packages/ subdirectory.
[general]
renderer=HTML5
copy-theme-extras=yes
plugins=plastexdepgraph  plastexshowmore  leanblueprint
packages-dirs=.

[document]
toc-depth=3
toc-non-files=True

[files]
directory=../web/
split-level= 0

[html5]
localtoc-level=0
extra-css=extra_styles.css
mathjax-dollars=False

# Dependency-graph node kinds (M5 Part B.3): plastexdepgraph's `thms` option
# (default definition+lemma+proposition+theorem+corollary) is NOT read from
# this ini file --- traced directly through plasTeX's package-loading code
# (plasTeX/Context.py's loadPythonPackage/ProcessOptions call chain) and
# confirmed empirically: `thms` is read only from the options dict attached
# to `\usepackage[...]{blueprint}` itself (leanblueprint's blueprint.py
# forwards that same dict straight into plastexdepgraph's own
# ProcessOptions), never from a plastex.cfg ini section, since neither
# package registers one. The actual fix lives in web.tex's
# `\usepackage[showmore, dep_graph, thms=...+conjecture+abbreviation]
# {blueprint}` line, extending the default list so `conjecture` and
# `abbreviation` become dependency-graph node kinds alongside
# definition/lemma/proposition/theorem/corollary.